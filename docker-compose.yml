services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: latitud18-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - latitud18-network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: latitud18-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - latitud18-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: latitud18-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: latitud18
      MYSQL_USER: latitud18
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - latitud18-db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - latitud18-network

volumes:
  latitud18-db-data:
    driver: local

networks:
  latitud18-network:
    driver: bridge
