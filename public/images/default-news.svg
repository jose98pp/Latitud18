<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Newspaper icon -->
  <g transform="translate(200, 150)">
    <!-- Paper background -->
    <rect x="-60" y="-40" width="120" height="80" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    
    <!-- Header line -->
    <rect x="-50" y="-30" width="100" height="4" rx="2" fill="#6b7280"/>
    
    <!-- Content lines -->
    <rect x="-50" y="-20" width="80" height="3" rx="1.5" fill="#9ca3af"/>
    <rect x="-50" y="-12" width="90" height="3" rx="1.5" fill="#9ca3af"/>
    <rect x="-50" y="-4" width="70" height="3" rx="1.5" fill="#9ca3af"/>
    
    <!-- Image placeholder -->
    <rect x="-50" y="8" width="40" height="25" rx="2" fill="#e5e7eb" stroke="#d1d5db"/>
    <circle cx="-35" cy="15" r="3" fill="#9ca3af"/>
    <polygon points="-45,25 -30,18 -25,25" fill="#9ca3af"/>
    
    <!-- More content lines -->
    <rect x="-5" y="10" width="45" height="3" rx="1.5" fill="#9ca3af"/>
    <rect x="-5" y="18" width="35" height="3" rx="1.5" fill="#9ca3af"/>
    <rect x="-5" y="26" width="40" height="3" rx="1.5" fill="#9ca3af"/>
  </g>
  
  <!-- Subtle pattern overlay -->
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#f9fafb" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  
  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Sin imagen disponible
  </text>
</svg>